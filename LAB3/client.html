<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FleetBook Booking Client</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    max-width:900px;
    margin:40px auto;
}

textarea{
    width:100%;
    height:260px;
    font-family:monospace;
    font-size:15px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    font-size:16px;
    cursor:pointer;
}

pre{
    background:#f5f5f5;
    padding:15px;
    white-space:pre-wrap;
    border-radius:6px;
}
</style>

</head>

<body>

<h1>FleetBook Booking Client</h1>

<p>Edit the JSON below and click <b>Send Request</b>.</p>

<textarea id="payload">
{
    "bookingId":"BK001",
    "customerName":"Diniz Martins",
    "customerEmail":"diniz@email.com",
    "vehicleType":"SUV",
    "pickupLocation":"Ottawa",
    "pickupDate":"2026-08-01",
    "returnDate":"2026-08-05",
    "notes":"GPS, insurance"
}
</textarea>

<br>

<button onclick="sendRequest()">
Send Request
</button>

<h2>Response</h2>

<pre id="result"></pre>

<script>

// =======================================
// COLE A URL DA SUA LOGIC APP AQUI
// =======================================

const logicAppUrl =
"https://prod-02.canadacentral.logic.azure.com:443/workflows/c85dcc1aa14642d5b901cf47bfe7457b/triggers/When_an_HTTP_request_is_received/paths/invoke?api-version=2016-10-01&sp=%2Ftriggers%2FWhen_an_HTTP_request_is_received%2Frun&sv=1.0&sig=4jXqOBYLAOkpmEpMNAcExha17Cs1QdCE4s4i21quKew";

// =======================================

async function sendRequest(){

    const payload=document.getElementById("payload").value;

    try{

        const response=await fetch(logicAppUrl,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:payload
        });

        const json=await response.json();

        document.getElementById("result").textContent=
            JSON.stringify(json,null,4);

    }

    catch(error){

        document.getElementById("result").textContent=
            error;

    }

}

</script>

</body>
</html>
